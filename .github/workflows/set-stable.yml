name: Set stable

on:
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [legacy, enhanced]
        required: true
      platform:
        type: choice
        options: [win32, linux]
        required: true
      version:
        description: Build id already present in the catalog
        type: string
        required: true

permissions:
  contents: write

jobs:
  set-stable:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          .github/scripts/set-stable.sh \
            "${{ inputs.product }}" \
            "${{ inputs.platform }}" \
            "${{ inputs.version }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions/
          git commit -m "chore(versions): stable ${{ inputs.product }}/${{ inputs.platform }} -> ${{ inputs.version }}"
          git push
